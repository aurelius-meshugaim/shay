<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Stones</title>
  <style>
    :root { --c1:#9fb4c8; --c2:#d7e2ec; }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    html, body { height: 100%; overflow: hidden; background: #06080b;
      font-family: "Inter","Helvetica Neue",Helvetica,Arial,sans-serif;
      -webkit-font-smoothing: antialiased; }

    /* full-bleed cairn photo */
    .bg {
      position: fixed; inset: 0; z-index: 0;
      background: #06080b url("bg.webp") center / cover no-repeat;
      opacity: 0; transform: scale(1.06);
      filter: brightness(0.62) saturate(0.95);
      animation: bgIn 2.4s cubic-bezier(0.16,1,0.3,1) forwards,
                 breathe 40s ease-in-out 2.4s infinite;
    }
    @keyframes bgIn { to { opacity: 1; transform: scale(1); } }
    @keyframes breathe { 0%,100%{transform:scale(1);} 50%{transform:scale(1.035);} }

    /* gentle vignette */
    .vignette { position: fixed; inset: 0; z-index: 1; pointer-events: none;
      background: radial-gradient(ellipse at center,
        rgba(6,8,11,0) 35%, rgba(6,8,11,0.72) 100%); }

    .wrap { position: fixed; inset: 0; z-index: 2; display: flex;
      flex-direction: column; align-items: center; justify-content: center;
      text-align: center; padding: 6vh 6vw; gap: clamp(1.4rem, 3vh, 2.4rem); }

    .title { font-size: clamp(2.8rem, 9vw, 6.5rem); font-weight: 800;
      letter-spacing: -0.03em; line-height: 1;
      background: linear-gradient(120deg,#fff 30%,var(--c1) 70%,var(--c2) 95%);
      -webkit-background-clip: text; background-clip: text;
      -webkit-text-fill-color: transparent;
      filter: drop-shadow(0 2px 5px rgba(0,0,0,.85)) drop-shadow(0 4px 22px rgba(0,0,0,.6));
      opacity: 0; animation: rise 1.3s cubic-bezier(0.16,1,0.3,1) .4s forwards; }

    .lead { font-size: clamp(.85rem,1.9vw,1.05rem); font-weight: 300;
      letter-spacing: .04em; color: rgba(255,255,255,.9); max-width: 30rem;
      text-shadow: 0 1px 3px rgba(0,0,0,.8);
      opacity: 0; animation: rise 1.3s cubic-bezier(0.16,1,0.3,1) .7s forwards; }

    /* the one example stone */
    .stone { opacity: 0; cursor: pointer; animation: rise 1.4s cubic-bezier(0.16,1,0.3,1) 1s forwards; }
    .stone figure {
      width: clamp(13rem, 30vw, 19rem); aspect-ratio: 1 / 1;
      border-radius: 18px; overflow: hidden;
      box-shadow: 0 18px 50px -12px rgba(0,0,0,.75), 0 0 0 1px rgba(255,255,255,.08) inset;
      transition: transform .6s cubic-bezier(0.16,1,0.3,1); }
    .stone img { width: 100%; height: 100%; object-fit: cover; display: block;
      transform: scale(1.01); transition: transform 8s ease-out; }
    .stone:hover figure { transform: translateY(-4px); }
    .stone:hover img { transform: scale(1.08); }
    .stone figcaption { margin-top: .9rem; }
    .stone .name { font-size: clamp(1rem,2.4vw,1.25rem); font-weight: 600;
      color: rgba(255,255,255,.96); letter-spacing: .01em;
      text-shadow: 0 1px 3px rgba(0,0,0,.8); }
    .stone .cap { margin-top: .35rem; font-size: clamp(.72rem,1.5vw,.85rem);
      font-weight: 300; font-style: italic; color: rgba(255,255,255,.7);
      text-shadow: 0 1px 2px rgba(0,0,0,.8); }

    .soon { display: flex; align-items: center; gap: 1rem;
      font-size: clamp(.7rem,1.4vw,.82rem); font-weight: 500;
      letter-spacing: .55em; text-indent: .55em; text-transform: uppercase;
      color: rgba(255,255,255,.9); text-shadow: 0 1px 3px rgba(0,0,0,.85);
      opacity: 0; animation: rise 1.3s cubic-bezier(0.16,1,0.3,1) 1.3s forwards; }
    .soon::before, .soon::after { content: ""; display: block;
      width: clamp(2rem,6vw,4rem); height: 1px;
      background: linear-gradient(90deg, transparent, rgba(255,255,255,.4)); }
    .soon::after { background: linear-gradient(90deg, rgba(255,255,255,.4), transparent); }

    @keyframes rise {
      from { opacity: 0; transform: translateY(26px); filter: blur(6px); }
      to   { opacity: 1; transform: translateY(0);    filter: blur(0);   } }
  
    /* ---- lightbox gallery for the one ready stone ---- */
    .lb { position: fixed; inset: 0; z-index: 10; display: none;
      align-items: center; justify-content: center; flex-direction: column;
      gap: clamp(.6rem,1.5vh,1rem); padding: 4vh 4vw;
      background: rgba(4,6,9,0.9); backdrop-filter: blur(8px);
      -webkit-backdrop-filter: blur(8px); }
    .lb.open { display: flex; animation: lbIn .35s ease forwards; }
    @keyframes lbIn { from{opacity:0} to{opacity:1} }
    .lb-title { font-size: clamp(1.1rem,2.6vw,1.6rem); font-weight:700; letter-spacing:.01em;
      color:#fff; text-shadow:0 1px 4px rgba(0,0,0,.8); }
    .lb-name { font-size: clamp(.7rem,1.5vw,.82rem); font-weight:600; letter-spacing:.34em;
      text-transform:uppercase; color:var(--c1); text-shadow:0 1px 3px rgba(0,0,0,.8); }
    .lb-stage { position: relative; width: min(86vw, 60vh); aspect-ratio: 1/1;
      border-radius: 16px; overflow: hidden;
      box-shadow: 0 24px 70px -18px rgba(0,0,0,.8), 0 0 0 1px rgba(255,255,255,.08) inset; }
    .lb-stage img { position:absolute; inset:0; width:100%; height:100%; object-fit:cover;
      opacity:0; transition: opacity .4s ease; }
    .lb-stage img.active { opacity:1; }
    .lb-cap { min-height: 1.3em; font-size: clamp(.78rem,1.7vw,.92rem); font-weight:300;
      font-style: italic; color: rgba(255,255,255,.82); text-align:center;
      text-shadow:0 1px 3px rgba(0,0,0,.8); max-width: 32rem; }
    .lb-nav { position:absolute; top:50%; transform:translateY(-50%);
      width:44px; height:44px; border:0; border-radius:50%; cursor:pointer;
      background: rgba(0,0,0,.45); color:#fff; font-size:1.4rem; line-height:1;
      display:flex; align-items:center; justify-content:center;
      transition: background .2s; user-select:none; z-index:2; }
    .lb-nav:hover { background: rgba(0,0,0,.7); }
    .lb-nav.prev { left:10px; } .lb-nav.next { right:10px; }
    .lb-thumbs { display:flex; gap:.6rem; flex-wrap:wrap; justify-content:center; max-width:94vw; }
    .lb-thumbs button { display:flex; flex-direction:column; align-items:center; gap:.35rem;
      border:0; background:none; padding:0; cursor:pointer; opacity:.55;
      transition:opacity .2s, transform .2s; }
    .lb-thumbs button:hover { opacity:.85; }
    .lb-thumbs button.on { opacity:1; transform:translateY(-2px); }
    .lb-thumbs img { width:clamp(40px,8vw,58px); height:clamp(40px,8vw,58px); object-fit:cover;
      border-radius:9px; display:block; box-shadow:0 0 0 1px rgba(255,255,255,.12) inset; }
    .lb-thumbs button.on img { box-shadow:0 0 0 2px var(--c2); }
    .lb-thumbs span { font-size:clamp(.52rem,1.1vw,.62rem); font-weight:600; letter-spacing:.05em;
      text-transform:uppercase; color:rgba(255,255,255,.78); white-space:nowrap; }
    .lb-close { position:fixed; top:18px; right:22px; width:42px; height:42px; border:0;
      border-radius:50%; background:rgba(0,0,0,.4); color:#fff; font-size:1.5rem; cursor:pointer;
      display:flex; align-items:center; justify-content:center; z-index:3; }
    .lb-close:hover { background:rgba(0,0,0,.7); }

    /* ---- offer ---- */
    .lb-offer { display:flex; flex-direction:column; align-items:center; gap:.8rem;
      width:min(86vw,30rem); }
    .offer-btn { border:0; cursor:pointer; padding:.6rem 2.6rem; border-radius:999px;
      font-size:clamp(.72rem,1.5vw,.84rem); font-weight:600; letter-spacing:.28em; text-transform:uppercase;
      color:#06080b; background:linear-gradient(120deg,#fff,var(--c2) 70%,var(--c1));
      box-shadow:0 6px 22px -6px rgba(0,0,0,.7); transition:transform .2s, box-shadow .2s; }
    .offer-btn:hover { transform:translateY(-2px); box-shadow:0 10px 30px -8px rgba(0,0,0,.85); }
    .offer-btn[hidden] { display:none; }
    .offer-form { width:100%; display:flex; flex-direction:column; gap:.8rem;
      animation:offerIn .35s cubic-bezier(0.16,1,0.3,1); }
    .offer-form[hidden] { display:none; }
    @keyframes offerIn { from{opacity:0;transform:translateY(10px)} to{opacity:1;transform:translateY(0)} }
    .offer-row { display:flex; gap:.7rem; }
    @media(max-width:480px){ .offer-row{flex-direction:column;} }
    .offer-field { flex:1; display:flex; flex-direction:column; gap:.32rem; text-align:left; }
    .offer-field > span { font-size:.6rem; font-weight:600; letter-spacing:.16em; text-transform:uppercase;
      color:rgba(255,255,255,.6); padding-left:.2rem; }
    .offer-field input { width:100%; padding:.62rem .8rem; border-radius:11px; font-family:inherit;
      border:1px solid rgba(255,255,255,.14); background:rgba(255,255,255,.06); color:#fff; font-size:.92rem;
      outline:none; transition:border-color .2s, background .2s; }
    .offer-field input::placeholder { color:rgba(255,255,255,.3); }
    .offer-field input:focus { border-color:var(--c2); background:rgba(255,255,255,.1); }
    .offer-price { position:relative; display:flex; align-items:center; }
    .offer-price .k { position:absolute; right:.85rem; font-size:.9rem; font-weight:700; color:var(--c1);
      pointer-events:none; }
    .offer-price input { padding-right:2.7rem;
      -moz-appearance:textfield; appearance:textfield; }
    .offer-price input::-webkit-outer-spin-button,
    .offer-price input::-webkit-inner-spin-button { -webkit-appearance:none; margin:0; }
    .offer-send { border:0; cursor:pointer; padding:.66rem; border-radius:11px; font-family:inherit;
      font-size:.8rem; font-weight:600; letter-spacing:.12em; text-transform:uppercase; color:#06080b;
      background:linear-gradient(120deg,#fff,var(--c2)); transition:transform .15s, opacity .2s; }
    .offer-send:hover { transform:translateY(-1px); }
    .offer-send:disabled { opacity:.5; cursor:default; transform:none; }
    .offer-msg { min-height:1em; font-size:.8rem; font-weight:300; line-height:1.4;
      color:var(--c2); text-align:center; }
    .offer-msg.err { color:#ff9d9d; }
</style>
</head>
<body>
  <div class="bg"></div>
  <div class="vignette"></div>

  <main class="wrap">
    <h1 class="title">Stones</h1>
    <p class="lead">A quiet collection — each stone re-scened through its own skies. One is ready.</p>

    <div class="stone" onclick="openLB()" role="button" tabindex="0" aria-label="Open Banded Flint gallery">
      <figure>
        <img src="stones/flint/blur.jpg" alt="Banded Flint" />
      </figure>
      <figcaption>
        <div class="name">Banded Flint</div>
        <div class="cap">Whispers of ancient earth, softly revealed.</div>
      </figcaption>
    </div>

    <div class="soon">coming soon</div>
  </main>

  <div class="lb" id="lb" aria-modal="true" role="dialog">
    <button class="lb-close" aria-label="Close" onclick="closeLB(event)">&times;</button>
    <div class="lb-title">Banded Flint</div>
    <div class="lb-name" id="lbName"></div>
    <div class="lb-stage" id="lbStage">
      <button class="lb-nav prev" aria-label="Previous" onclick="lbGo(-1,event)">&#10094;</button>
      <button class="lb-nav next" aria-label="Next" onclick="lbGo(1,event)">&#10095;</button>
    </div>
    <div class="lb-cap" id="lbCap"></div>
    <div class="lb-thumbs" id="lbThumbs"></div>
    <div class="lb-offer">
      <button class="offer-btn" id="offerToggle" onclick="toggleOffer(event)">Offer</button>
      <form class="offer-form" id="offerForm" hidden onsubmit="submitOffer(event)">
        <div class="offer-row">
          <label class="offer-field">
            <span>Your offer</span>
            <div class="offer-price"><span class="k">k$</span>
              <input type="number" id="offerPrice" min="0" step="0.5" inputmode="decimal" placeholder="0" required />
            </div>
          </label>
          <label class="offer-field">
            <span>Email</span>
            <input type="email" id="offerEmail" placeholder="you@example.com" required />
          </label>
        </div>
        <button type="submit" class="offer-send">Send offer</button>
        <div class="offer-msg" id="offerMsg" role="status"></div>
      </form>
    </div>
  </div>

  <script>
    const FLINT_NAME = "Banded Flint";
    const FLINT = [
      { src:"stones/flint/blur.jpg",     name:"Sophisticated Blur", cap:"Whispers of ancient earth, softly revealed." },
      { src:"stones/flint/outdoor.jpg",  name:"Outdoor",            cap:"Water-kissed, an ancient heart revealed." },
      { src:"stones/flint/indoor.jpg",   name:"Indoor",             cap:"Geological art, precisely unveiled." },
      { src:"stones/flint/creative.jpg", name:"Creative",           cap:"A star-shard, eons in its core." },
      { src:"stones/flint/original.jpg", name:"Original",           cap:"The original photograph." },
    ];
    const lb=document.getElementById('lb'), stage=document.getElementById('lbStage'),
          cap=document.getElementById('lbCap'), nameEl=document.getElementById('lbName'),
          thumbs=document.getElementById('lbThumbs');
    let idx=0; const imgs=[];
    FLINT.forEach((v,i)=>{
      const im=document.createElement('img'); im.src=v.src; im.alt=v.name; im.loading='lazy';
      stage.insertBefore(im, stage.querySelector('.lb-nav.next')); imgs.push(im);
      const b=document.createElement('button'); b.setAttribute('aria-label',v.name);
      b.innerHTML='<img src="'+v.src+'" alt=""><span>'+v.name+'</span>';
      b.onclick=(e)=>{ e.stopPropagation(); show(i); }; thumbs.appendChild(b);
    });
    function show(i){ idx=(i+FLINT.length)%FLINT.length;
      imgs.forEach((im,k)=>im.classList.toggle('active',k===idx));
      [...thumbs.children].forEach((b,k)=>b.classList.toggle('on',k===idx));
      nameEl.textContent=FLINT[idx].name; cap.textContent=FLINT[idx].cap; }
    function openLB(){ lb.classList.add('open'); show(0); resetOffer(); document.addEventListener('keydown',lbKey); }
    function closeLB(e){ if(e) e.stopPropagation(); lb.classList.remove('open'); document.removeEventListener('keydown',lbKey); }

    // ---- offer ----
    const OFFER_TO = ""; // set to an email to route offers via the visitor's mail client; empty = confirm only
    function toggleOffer(e){ if(e) e.stopPropagation();
      document.getElementById('offerToggle').hidden = true;
      document.getElementById('offerForm').hidden = false;
      document.getElementById('offerPrice').focus(); }
    function resetOffer(){
      const t=document.getElementById('offerToggle'), f=document.getElementById('offerForm'),
            m=document.getElementById('offerMsg');
      if(!t||!f) return;
      t.hidden=false; f.hidden=true; f.reset();
      f.querySelector('.offer-send').disabled=false;
      m.textContent=''; m.className='offer-msg'; }
    function submitOffer(e){ e.preventDefault();
      const price=parseFloat(document.getElementById('offerPrice').value),
            email=document.getElementById('offerEmail').value.trim(),
            m=document.getElementById('offerMsg');
      if(!(price>0)){ m.textContent='Enter an offer above 0.'; m.className='offer-msg err'; return; }
      const usd=(price*1000).toLocaleString('en-US',{style:'currency',currency:'USD',maximumFractionDigits:0});
      m.className='offer-msg';
      m.textContent='Thank you — your offer of '+usd+' for '+FLINT_NAME+' is in. We’ll be in touch at '+email+'.';
      document.getElementById('offerForm').querySelector('.offer-send').disabled=true;
      if(OFFER_TO){
        const sub=encodeURIComponent('Offer on '+FLINT_NAME+' — '+usd),
              body=encodeURIComponent('Stone: '+FLINT_NAME+'\nOffer: '+usd+' ('+price+' k$)\nFrom: '+email);
        window.location.href='mailto:'+OFFER_TO+'?subject='+sub+'&body='+body;
      } }
    function lbGo(d,e){ if(e) e.stopPropagation(); show(idx+d); }
    function lbKey(e){ if(e.key==='Escape')closeLB(); else if(e.key==='ArrowRight')lbGo(1); else if(e.key==='ArrowLeft')lbGo(-1); }
    lb.addEventListener('click', e=>{ if(e.target===lb) closeLB(); });   // click backdrop to close
    document.querySelector('.stone').addEventListener('keydown', e=>{ if(e.key==='Enter'||e.key===' '){e.preventDefault();openLB();} });
  </script>
</body>
</html>
